name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          cache-dependency-path: go.sum

      - name: Run root tests
        run: go test -race -coverprofile=coverage.txt ./...

      - name: Check coverage
        run: python3 .github/scripts/coverage.py 28 coverage.txt

      - name: Run fast checks
        run: make check-go-mod-tidy check-licenses

      - name: Generate Templ files
        run: make app-generate

      - name: Run bootstrap tests
        run: make app-test

      - name: Build bootstrap application
        run: make app-build
